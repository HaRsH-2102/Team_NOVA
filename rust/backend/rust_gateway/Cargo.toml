[package]
name = "rust_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
awc = "3"
redis = { version = "0.24", features = ["aio", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
num_cpus = "1.16"
chrono = "0.4"
lazy_static = "1.4"