[package]
name = "rust_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix = "0.13"
actix-web-actors = "4"
awc = "3"

redis = { version = "0.24", features = ["aio", "tokio-comp"] }
deadpool-redis = { version = "0.14", features = ["rt_tokio_1"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

lazy_static = "1.4"
chrono = "0.4"
num_cpus = "1.16"