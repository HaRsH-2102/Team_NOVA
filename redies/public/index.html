<!DOCTYPE html>
<html>
<head>
  <title>Advanced API Gateway Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 200px;
      text-align: center;
    }

    .logs {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .log {
      border-bottom: 1px solid #333;
      padding: 5px 0;
    }
  </style>
</head>

<body>

<h1>🚀 API Gateway Dashboard</h1>

<div class="cards">
  <div class="card">
    <h3>Total</h3>
    <h2 id="total">0</h2>
  </div>
  <div class="card">
    <h3>Blocked</h3>
    <h2 id="blocked">0</h2>
  </div>
  <div class="card">
    <h3>Rate Limited</h3>
    <h2 id="rate">0</h2>
  </div>
</div>

<canvas id="chart" height="100"></canvas>

<div class="logs">
  <h3>Recent Activity</h3>
  <div id="logs"></div>
</div>

<script>
let chart;

async function loadMetrics() {
  const res = await fetch('/metrics');
  const data = await res.json();

  document.getElementById("total").innerText = data.totalRequests;
  document.getElementById("blocked").innerText = data.blockedRequests;
  document.getElementById("rate").innerText = data.rateLimited;

  // Chart update
  if (!chart) {
    const ctx = document.getElementById("chart").getContext("2d");
    chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Total", "Blocked", "Rate Limited"],
        datasets: [{
          label: "Traffic",
          data: [
            data.totalRequests,
            data.blockedRequests,
            data.rateLimited
          ]
        }]
      }
    });
  } else {
    chart.data.datasets[0].data = [
      data.totalRequests,
      data.blockedRequests,
      data.rateLimited
    ];
    chart.update();
  }

  // Logs
  const logsDiv = document.getElementById("logs");
  logsDiv.innerHTML = "";

  data.logs.forEach(log => {
    const div = document.createElement("div");
    div.className = "log";
    div.innerText = `[${log.time}] ${log.type} → ${log.method} ${log.path} (${log.ip})`;
    logsDiv.appendChild(div);
  });
}

setInterval(loadMetrics, 1000);
loadMetrics();


let map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

async function loadMap() {
  const res = await fetch('/metrics');
  const data = await res.json();

  data.attackerIPs.forEach(async ip => {
    try {
      const geo = await fetch(`https://ipapi.co/${ip}/json/`);
      const loc = await geo.json();

      if (loc.latitude && loc.longitude) {
        L.marker([loc.latitude, loc.longitude])
          .addTo(map)
          .bindPopup(`Attacker: ${ip}`);
      }
    } catch {}
  });
}
</script>

<h3>🌍 Attacker Map</h3>
<div id="map" style="height:300px;"></div>

</body>
</html>
